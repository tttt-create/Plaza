<style>
:root {

* { box-sizing: border-box; }

}
body::after {

}

.combo { position: absolute; right: 8px; top: 7px; font: 700 12px var(--font); color: var(--ink); background: var(--ochre-soft); border: 1px solid #ecd49a; padding: 2px 9px; border-radius: 99px; pointer-events: none; transition: transform .2s; }
.combo.hidden { display: none; }

.memo { margin: 12px 14px 0; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--ochre-soft); border: 1px solid #ecd49a; }

.layout { padding: 8px 14px 14px; max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; }
.panel { display: block; }
@media (max-height: 720px) and (max-width: 959px) {

}

}

.recipes { display: flex; flex-direction: column; gap: 8px; }

.r-out { grid-row: 1 / span 3; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; background: var(--paper-2); }
